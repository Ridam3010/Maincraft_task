<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maincrafts Technology</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Welcome to Maincrafts Technology</h1>
            <p>Empowering the future with cutting-edge software solutions.</p>
            <a href="#contact" class="cta-button">Get in Touch</a>
        </div>
    </header>

    <section id="contact" class="contact-section">
        <div class="container">
            <h2>Contact Us</h2>
            <p class="subtitle">We'd love to hear from you. Please fill out the form below.</p>
            <form action="/contact" method="post" class="contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
                </div>
                <button type="submit" class="submit-button">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Maincrafts Technology. All rights reserved.</p>
    </footer>
</body>
</html>
