<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="contact-section">
        <h1 style="text-align:center;margin-bottom:.2rem;">Admin Dashboard</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Message</th>
            </tr>
            <tbody id="contactTable"></tbody>
        </table>
    </div>
    <script>
        fetch("http://localhost:8080/contacts").then(response => response.json()).then(data => {
            console.log("Here is the data from Java", data);
            let table = document.getElementById("contactTable");
            data.forEach(contact => {
                let row = `<tr>
                <td>${contact.id}</td>
                <td>${contact.name}</td>
                <td>${contact.email}</td>
                <td>${contact.message}</td>
                </tr>`;
                table.innerHTML += row;
            });
        });
    </script>
</body>

</html>
